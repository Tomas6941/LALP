<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ MLE.nombre }} · {{ MLE.lista }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ MLE.lema }} — {{ MLE.nombre }} ({{ MLE.lista }}).{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ MLE.nombre }} · {{ MLE.lista }}">
  <meta property="og:description" content="{{ MLE.lema }}">
  <meta property="og:image" content="{{ url_for('static', filename='img/og-image.webp') }}">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <a href="#inicio" class="skip-link">Saltar al contenido</a>
  {% include "partials/_nav.html" %}
  <main id="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="contenedor flash-wrap">
          {% for category, msg in messages %}
            <p class="flash flash--{% if category == 'success' %}success{% else %}error{% endif %}">{{ msg }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% include "partials/_footer.html" %}
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
