{% extends "base.html" %}
{% block title %}Panel administrativo · {{ MLE.sigla }}{% endblock %}
{% block content %}
<section class="sec">
  <div class="contenedor">
    <div class="panel panel--auth">
      <h1 class="sec__title">Panel administrativo</h1>
      <form method="post" class="form">
        {{ form.hidden_tag() }}
        <div class="field">
          {{ form.usuario.label }}
          {{ form.usuario }}
        </div>
        <div class="field">
          {{ form.password.label }}
          {{ form.password(type="password") }}
        </div>
        <button type="submit" class="btn btn--accent btn--block">Ingresar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
