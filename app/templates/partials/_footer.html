<footer class="pie">
  <div class="contenedor">
    <p class="pie__lema">{{ MLE.lema }}</p>
    <p class="pie__disclaimer">{{ FOOTER_DISCLAIMER }}</p>
    <ul class="pie__redes">
      {% for red in REDES %}
      <li><a href="{{ red.url }}">{{ red.nombre }}</a></li>
      {% endfor %}
    </ul>
    <p class="pie__copy">© {{ MLE.nombre }} · {{ MLE.lista }}</p>
  </div>
</footer>
