<footer class="footer">
  <div class="contenedor">
    <p class="footer__motto">{{ MLE.lema }}</p>
    <p class="footer__note">{{ FOOTER_DISCLAIMER }}</p>
    <ul class="footer__links">
      {% for red in REDES %}
      <li><a href="{{ red.url }}">{{ red.nombre }}</a></li>
      {% endfor %}
    </ul>
    <p class="footer__copy">© {{ MLE.nombre }} · {{ MLE.lista }}</p>
  </div>
</footer>
