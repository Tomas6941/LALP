{# Águila MLE — SVG inline. Decorativa (el texto del hero ya comunica la marca).
   Las alas se animan por CSS (.aguila__ala--izq / --der) definido en styles.css. #}
<svg class="hero__aguila" viewBox="0 0 240 220" role="presentation" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mleAguila" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mleAla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Ala izquierda -->
  <path class="aguila__ala aguila__ala--izq" fill="url(#mleAla)" stroke="#dbeafe" stroke-width="1.5" stroke-linejoin="round"
        d="M118 78 C 86 56, 44 42, 12 52 C 24 86, 58 112, 108 126 C 116 110, 118 94, 118 78 Z"/>
  <path class="aguila__ala aguila__ala--izq" fill="none" stroke="#1e40af" stroke-width="1.4" stroke-linecap="round" opacity="0.55"
        d="M112 84 C 84 74, 52 62, 26 58 M108 98 C 82 90, 56 82, 34 78 M104 112 C 84 106, 62 100, 46 96"/>

  <!-- Ala derecha -->
  <path class="aguila__ala aguila__ala--der" fill="url(#mleAla)" stroke="#dbeafe" stroke-width="1.5" stroke-linejoin="round"
        d="M122 78 C 154 56, 196 42, 228 52 C 216 86, 182 112, 132 126 C 124 110, 122 94, 122 78 Z"/>
  <path class="aguila__ala aguila__ala--der" fill="none" stroke="#1e40af" stroke-width="1.4" stroke-linecap="round" opacity="0.55"
        d="M128 84 C 156 74, 188 62, 214 58 M132 98 C 158 90, 184 82, 206 78 M136 112 C 156 106, 178 100, 194 96"/>

  <!-- Cola -->
  <path fill="url(#mleAguila)" stroke="#dbeafe" stroke-width="1.5" stroke-linejoin="round"
        d="M103 164 L120 206 L137 164 Z"/>

  <!-- Cuerpo -->
  <path fill="url(#mleAguila)" stroke="#dbeafe" stroke-width="1.6" stroke-linejoin="round"
        d="M120 62 C 106 62, 97 76, 97 96 C 97 128, 108 158, 120 180 C 132 158, 143 128, 143 96 C 143 76, 134 62, 120 62 Z"/>

  <!-- Chest / detalle -->
  <path fill="none" stroke="#1e40af" stroke-width="1.6" stroke-linecap="round" opacity="0.5"
        d="M110 104 C 116 112, 124 112, 130 104"/>

  <!-- Cabeza y pico -->
  <circle cx="120" cy="48" r="15" fill="url(#mleAguila)" stroke="#dbeafe" stroke-width="1.6"/>
  <path fill="#1e40af" d="M108 44 L132 44 L120 63 Z"/>
  <circle cx="113" cy="45" r="2.4" fill="#0a1128"/>
  <circle cx="127" cy="45" r="2.4" fill="#0a1128"/>
</svg>
