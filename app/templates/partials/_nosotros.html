<section id="nosotros" class="sec">
  <div class="contenedor">
    <header class="sec__head" data-reveal>
      <h2 class="sec__title">Nosotros</h2>
      <p class="sec__sub">{{ NOSOTROS.intro }}</p>
    </header>

    <ul class="cards cards--3">
      {% for titulo, detalle in NOSOTROS.principios %}
      <li class="card" data-reveal>
        <h3 class="card__title">{{ titulo }}</h3>
        <p class="card__text">{{ detalle }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
