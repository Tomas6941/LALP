<section id="nosotros" class="sec">
  <div class="contenedor">
    <h2 class="sec__titulo">Nosotros</h2>
    <div class="sec__regla"></div>
    <p class="sec__baja">{{ NOSOTROS.intro }}</p>
    <ul class="grid grid--3 grid--pad">
      {% for titulo, detalle in NOSOTROS.principios %}
      <li class="tarjeta">
        <span class="tarjeta__cinta"></span>
        <h3 class="tarjeta__titulo tarjeta__titulo--acento">{{ titulo }}</h3>
        <p class="tarjeta__texto">{{ detalle }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
