<section id="plan" class="sec sec--alt">
  <div class="contenedor">
    <h2 class="sec__titulo">Plan primeros <span class="acento">90 días</span></h2>
    <div class="sec__regla"></div>

    <ol class="timeline">
      {% for periodo, prioridades in PLAN_90 %}
      <li class="timeline__item">
        <h3 class="timeline__periodo">{{ periodo }}</h3>
        <ul class="lista-disc">
          {% for item in prioridades %}<li>{{ item }}</li>{% endfor %}
        </ul>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
