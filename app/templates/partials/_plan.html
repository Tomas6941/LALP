<section id="plan" class="bg-violeta-oscuro/20 px-4 py-20">
  <div class="mx-auto max-w-5xl">
    <h2 class="text-4xl font-black uppercase text-violeta-claro">Plan primeros 90 días</h2>
    <ol class="mt-8 space-y-6 border-l-2 border-violeta pl-6">
      {% for periodo, prioridades in PLAN_90 %}
      <li class="relative">
        <span class="absolute -left-[31px] top-1 h-4 w-4 rounded-full bg-violeta"></span>
        <h3 class="text-xl font-bold">{{ periodo }}</h3>
        <ul class="mt-2 list-disc space-y-1 pl-5 text-sm">
          {% for item in prioridades %}<li>{{ item }}</li>{% endfor %}
        </ul>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
