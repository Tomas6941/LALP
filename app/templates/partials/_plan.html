<section id="plan" class="sec sec--alt">
  <div class="contenedor">
    <header class="sec__head" data-reveal>
      <h2 class="sec__title">Plan primeros 90 días</h2>
    </header>

    <ol class="groups">
      {% for periodo, prioridades in PLAN_90 %}
      <li class="group" data-reveal>
        <h3 class="group__header">{{ periodo }}</h3>
        <ul class="list list--plain">
          {% for item in prioridades %}<li class="list__item">{{ item }}</li>{% endfor %}
        </ul>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
