<section id="equipo" class="sec">
  <div class="contenedor">
    <h2 class="sec__titulo">Equipo</h2>
    <div class="sec__regla"></div>

    <div class="grid grid--2 grid--pad">
      <div class="perfil">
        <p class="perfil__rol">Presidente</p>
        <p class="perfil__nombre">{{ EQUIPO.presidente }}</p>
      </div>
      <div class="perfil">
        <p class="perfil__rol">Vicepresidente</p>
        <p class="perfil__nombre">{{ EQUIPO.vicepresidente }}</p>
      </div>
    </div>

    <h3 class="sec__subtitulo">Secretarías</h3>
    <ul class="secretarias">
      {% for nombre, quien in EQUIPO.secretarias %}
      <li class="secretaria">
        <span class="secretaria__area">{{ nombre }}</span>
        <span class="secretaria__quien">{{ quien }}</span>
      </li>
      {% endfor %}
    </ul>

    <h3 class="sec__subtitulo">Equipos de trabajo</h3>
    <ul class="chips">
      {% for equipo in EQUIPO.equipos %}
      <li class="chip">{{ equipo }}</li>
      {% endfor %}
    </ul>
  </div>
</section>
