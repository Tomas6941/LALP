<section id="equipo" class="mx-auto max-w-5xl px-4 py-20">
  <h2 class="text-4xl font-black uppercase text-violeta-claro">Equipo</h2>
  <div class="mt-8 grid gap-6 sm:grid-cols-2">
    <div class="rounded-card border border-violeta-oscuro/40 p-6">
      <p class="text-sm uppercase text-violeta-claro">Presidente</p>
      <p class="text-xl font-bold">{{ EQUIPO.presidente }}</p>
    </div>
    <div class="rounded-card border border-violeta-oscuro/40 p-6">
      <p class="text-sm uppercase text-violeta-claro">Vicepresidente</p>
      <p class="text-xl font-bold">{{ EQUIPO.vicepresidente }}</p>
    </div>
  </div>
  <h3 class="mt-10 text-2xl font-bold">Secretarías</h3>
  <ul class="mt-4 grid gap-3 sm:grid-cols-2">
    {% for nombre, quien in EQUIPO.secretarias %}
    <li class="rounded-card bg-violeta-oscuro/30 px-4 py-3"><span class="font-bold">{{ nombre }}</span> — {{ quien }}</li>
    {% endfor %}
  </ul>
  <h3 class="mt-10 text-2xl font-bold">Equipos de trabajo</h3>
  <ul class="mt-4 flex flex-wrap gap-3">
    {% for equipo in EQUIPO.equipos %}
    <li class="rounded-card border border-violeta-claro px-4 py-2">{{ equipo }}</li>
    {% endfor %}
  </ul>
</section>
