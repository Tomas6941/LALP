<section id="transparencia" class="mx-auto max-w-5xl px-4 py-20">
  <h2 class="text-4xl font-black uppercase text-violeta-claro">Transparencia</h2>
  <p class="mt-4 max-w-3xl text-lg">
    Nos comprometemos a publicar el estado de gestión y a rendir cuentas con indicadores
    medibles por área.
  </p>
  <div class="mt-8 overflow-x-auto">
    <table class="w-full border-collapse text-left text-sm">
      <thead>
        <tr class="border-b border-violeta-claro">
          <th class="py-2 pr-4">Área</th>
          <th class="py-2">Indicador</th>
        </tr>
      </thead>
      <tbody>
        {% for area, indicador in INDICADORES %}
        <tr class="border-b border-violeta-oscuro/30">
          <td class="py-2 pr-4 font-bold">{{ area }}</td>
          <td class="py-2">{{ indicador }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
