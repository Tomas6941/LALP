<section id="transparencia" class="sec">
  <div class="contenedor">
    <h2 class="sec__titulo">Transparencia</h2>
    <div class="sec__regla"></div>
    <p class="sec__baja">
      Nos comprometemos a publicar el estado de gestión y a rendir cuentas con indicadores medibles por área.
    </p>

    <div class="tabla-wrap">
      <table class="tabla">
        <caption class="sr-only">Indicadores de transparencia por área</caption>
        <thead>
          <tr>
            <th scope="col">Área</th>
            <th scope="col">Indicador</th>
          </tr>
        </thead>
        <tbody>
          {% for area, indicador in INDICADORES %}
          <tr>
            <td>{{ area }}</td>
            <td>{{ indicador }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
