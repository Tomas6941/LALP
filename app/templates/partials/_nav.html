<header class="nav">
  <nav class="contenedor nav__inner" aria-label="Principal">
    <a class="nav__marca" href="#inicio">
      <img class="nav__logo" src="{{ url_for('static', filename='img/logo.webp') }}" alt="{{ MLE.sigla }}" width="38" height="38" decoding="async">
      <span class="nav__sigla">{{ MLE.sigla }}</span>
    </a>

    <button class="nav__toggle" data-nav-toggle type="button"
            aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menú">☰</button>

    <ul id="nav-menu" data-nav-menu class="nav__lista nav__menu">
      {% for id, label in SECCIONES %}
      {% if id != 'sumate' %}
      <li><a class="nav__link" href="#{{ id }}">{{ label }}</a></li>
      {% endif %}
      {% endfor %}
      <li><a class="nav__link nav__link--cta" href="#sumate">Sumate</a></li>
    </ul>
  </nav>
</header>
